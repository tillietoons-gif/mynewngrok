name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ------------------------------------------------------------
      # Configure Windows Remote Desktop
      # ------------------------------------------------------------
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Inbound" | Out-Null
          netsh advfirewall firewall add rule `
            name="RDP-Inbound" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop configured successfully."

      # ------------------------------------------------------------
      # Create RDP User
      # ------------------------------------------------------------
      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Write-Host "Creating RDP user..."

          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = (
              [char[]](33..47) +
              [char[]](58..64) +
              [char[]](91..96) +
              [char[]](123..126)
            )
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if ($existingUser) {
            Write-Host "Existing RDP user found. Removing it..."
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "GitHub Actions RDP user"

          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "RDP user creation failed."
            exit 1
          }

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP CREDENTIALS"
          Write-Host "=========================================="
          Write-Host "Username: RDP"
          Write-Host "Password: $password"
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Install bore tunnel
      # ------------------------------------------------------------
      - name: Install bore tunnel
        shell: pwsh
        run: |
          Write-Host "Installing bore..."

          $boreUrl = "https://github.com/ekzhang/bore/releases/latest/download/bore.exe"
          $borePath = Join-Path $env:TEMP "bore.exe"

          Write-Host "Downloading bore..."
          try {
            Invoke-WebRequest -Uri $boreUrl -OutFile $borePath -UseBasicParsing
          } catch {
            # Fallback: build from cargo if prebuilt binary not available
            Write-Host "Prebuilt binary not found, trying cargo install..."
            cargo install bore-cli
            $borePath = (Get-Command bore -ErrorAction SilentlyContinue).Source
          }

          if (-not (Test-Path $borePath)) {
            Write-Error "bore download failed."
            exit 1
          }

          # Add to PATH
          $boreDir = Split-Path $borePath
          $env:PATH = "$boreDir;$env:PATH"
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          "BORE_EXE=$borePath" >> $env:GITHUB_ENV

          Write-Host "bore installed successfully at: $borePath"

      # ------------------------------------------------------------
      # Start bore TCP Tunnel
      # ------------------------------------------------------------
      - name: Start bore TCP Tunnel for RDP
        shell: pwsh
        run: |
          Write-Host "Starting bore TCP tunnel on port 3389..."

          $borePath = $env:BORE_EXE

          # Start bore in background, connecting to bore.pub server
          $boreProcess = Start-Process `
            -FilePath $borePath `
            -ArgumentList "local", "3389", "--to", "bore.pub" `
            -RedirectStandardOutput "bore.log" `
            -RedirectStandardError "bore-err.log" `
            -NoNewWindow `
            -PassThru

          "BORE_PID=$($boreProcess.Id)" >> $env:GITHUB_ENV

          # Wait for bore to establish tunnel and parse the port
          $borePort = $null
          $boreHost = "bore.pub"

          for ($retry = 1; $retry -le 20; $retry++) {
            Start-Sleep -Seconds 2

            if (Test-Path "bore.log") {
              $logContent = Get-Content "bore.log" -Raw -ErrorAction SilentlyContinue
              if ($logContent) {
                # bore prints: "listening at bore.pub:PORT"
                if ($logContent -match "listening at ([\w\.]+):(\d+)") {
                  $boreHost = $matches[1]
                  $borePort = $matches[2]
                  break
                }
                # Also try: "server listening" or "connected" patterns
                if ($logContent -match "bore\.pub:(\d+)") {
                  $borePort = $matches[1]
                  break
                }
              }
            }

            if (Test-Path "bore-err.log") {
              $errContent = Get-Content "bore-err.log" -Raw -ErrorAction SilentlyContinue
              if ($errContent -and $errContent -match "listening at ([\w\.]+):(\d+)") {
                $boreHost = $matches[1]
                $borePort = $matches[2]
                break
              }
              if ($errContent -and $errContent -match "bore\.pub:(\d+)") {
                $borePort = $matches[1]
                break
              }
            }

            Write-Host "Waiting for bore tunnel... attempt $retry/20"
          }

          if (-not $borePort) {
            Write-Error "bore tunnel did not establish."
            Write-Host "bore log:"
            if (Test-Path "bore.log") { Get-Content "bore.log" -Tail 30 }
            Write-Host "bore error log:"
            if (Test-Path "bore-err.log") { Get-Content "bore-err.log" -Tail 30 }
            exit 1
          }

          $boreAddress = "$boreHost`:$borePort"
          "BORE_ADDRESS=$boreAddress" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          BORE TUNNEL ESTABLISHED"
          Write-Host "=========================================="
          Write-Host "TCP Address: $boreAddress"
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Verify RDP Port
      # ------------------------------------------------------------
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connectivity on localhost:3389..."

          $testResult = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed."
            $testResult | Format-List
            exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      # ------------------------------------------------------------
      # Display Connection Information
      # ------------------------------------------------------------
      - name: Display RDP Access Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACCESS READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "  Address:  $env:BORE_ADDRESS"
          Write-Host "  Username: $env:RDP_USERNAME"
          Write-Host "  Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "  Use any RDP client (mstsc, Remmina,"
          Write-Host "  Mac RDP, etc.) to connect."
          Write-Host "  No VPN, no paid accounts, no apps needed!"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Keep Runner Alive
      # ------------------------------------------------------------
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "RDP runner is active."
          Write-Host "The workflow will remain running until cancelled."
          Write-Host ""

          while ($true) {
            $boreRunning = Get-Process -Id $env:BORE_PID -ErrorAction SilentlyContinue

            if (-not $boreRunning) {
              Write-Error "bore process died! RDP tunnel is down."
              exit 1
            }

            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active - $env:BORE_ADDRESS"
            Start-Sleep -Seconds 300
          }
