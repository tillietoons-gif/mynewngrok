name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ------------------------------------------------------------
      # Configure Windows Remote Desktop
      # ------------------------------------------------------------
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Standard RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Allow RDP traffic through firewall
          netsh advfirewall firewall delete rule name="RDP-Inbound" | Out-Null
          netsh advfirewall firewall add rule `
            name="RDP-Inbound" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart RDP service
          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop configured successfully."

      # ------------------------------------------------------------
      # Create RDP User
      # ------------------------------------------------------------
      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Write-Host "Creating RDP user..."

          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = (
              [char[]](33..47) +
              [char[]](58..64) +
              [char[]](91..96) +
              [char[]](123..126)
            )
          }

          # Generate a 16-character password
          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove existing account if it exists
          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Write-Host "Existing RDP user found. Removing it..."
            Remove-LocalUser -Name "RDP"
          }

          # Create user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "GitHub Actions RDP user"

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Verify user
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "RDP user creation failed."
            exit 1
          }

          # Pass values to subsequent steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          # Display credentials in Actions console
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP CREDENTIALS"
          Write-Host "=========================================="
          Write-Host "Username: RDP"
          Write-Host "Password: $password"
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Install ngrok
      # ------------------------------------------------------------
      - name: Install ngrok
        shell: pwsh
        run: |
          Write-Host "Installing ngrok..."

          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zipPath = Join-Path $env:TEMP "ngrok.zip"
          $extractPath = Join-Path $env:TEMP "ngrok"

          Write-Host "Downloading ngrok..."
          Invoke-WebRequest -Uri $ngrokUrl -OutFile $zipPath

          if (-not (Test-Path $zipPath)) {
            Write-Error "ngrok download failed."
            exit 1
          }

          # Extract
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $ngrokExe = Join-Path $extractPath "ngrok.exe"

          if (-not (Test-Path $ngrokExe)) {
            Write-Error "ngrok executable not found after extraction."
            exit 1
          }

          # Add to PATH for this session
          $env:PATH = "$extractPath;$env:PATH"
          "PATH=$env:PATH" >> $env:GITHUB_ENV

          Write-Host "ngrok installed successfully."

      # ------------------------------------------------------------
      # Start ngrok TCP Tunnel
      # ------------------------------------------------------------
      - name: Start ngrok TCP Tunnel for RDP
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Error "NGROK_AUTH_TOKEN GitHub secret is not configured."
            exit 1
          }

          Write-Host "Configuring ngrok auth token..."
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ngrok auth token configuration failed."
            exit 1
          }

          Write-Host "Starting ngrok TCP tunnel on port 3389..."

          # Start ngrok in background
          $ngrokProcess = Start-Process `
            -FilePath "ngrok" `
            -ArgumentList "tcp", "3389", "--log=stdout" `
            -RedirectStandardOutput "ngrok.log" `
            -RedirectStandardError "ngrok-err.log" `
            -NoNewWindow `
            -PassThru

          "NGROK_PID=$($ngrokProcess.Id)" >> $env:GITHUB_ENV

          # Wait for ngrok to establish the tunnel
          Start-Sleep -Seconds 5

          # Query ngrok API for the public address
          $tunnelUrl = $null

          for ($retry = 1; $retry -le 15; $retry++) {
            try {
              $response = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -Method Get `
                -TimeoutSec 5

              if ($response.tunnels.Count -gt 0) {
                $tunnelUrl = $response.tunnels[0].public_url
                break
              }
            } catch {
              Write-Host "Waiting for ngrok tunnel... attempt $retry/15"
              Start-Sleep -Seconds 3
            }
          }

          if (-not $tunnelUrl) {
            Write-Error "ngrok tunnel did not establish."
            Write-Host "ngrok log:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" -Tail 20 }
            Write-Host "ngrok error log:"
            if (Test-Path "ngrok-err.log") { Get-Content "ngrok-err.log" -Tail 20 }
            exit 1
          }

          # Parse the TCP address (format: tcp://x.tcp.ngrok.io:PORT)
          $tcpAddress = $tunnelUrl -replace "tcp://", ""

          "NGROK_TCP_ADDRESS=$tcpAddress" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          NGROK TUNNEL ESTABLISHED"
          Write-Host "=========================================="
          Write-Host "TCP Address: $tcpAddress"
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Verify RDP Port
      # ------------------------------------------------------------
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connectivity on localhost:3389..."

          $testResult = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed."
            $testResult | Format-List
            exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      # ------------------------------------------------------------
      # Display Connection Information
      # ------------------------------------------------------------
      - name: Display RDP Access Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACCESS READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "  Address:  $env:NGROK_TCP_ADDRESS"
          Write-Host "  Username: $env:RDP_USERNAME"
          Write-Host "  Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "  Use any RDP client (mstsc, Remmina,"
          Write-Host "  Mac RDP, etc.) to connect to the address."
          Write-Host "  No VPN or extra apps needed!"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # Keep Runner Alive
      # ------------------------------------------------------------
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "RDP runner is active."
          Write-Host "The workflow will remain running until cancelled."
          Write-Host ""

          while ($true) {
            # Check if ngrok is still running
            $ngrokRunning = Get-Process -Id $env:NGROK_PID -ErrorAction SilentlyContinue

            if (-not $ngrokRunning) {
              Write-Error "ngrok process died! RDP tunnel is down."
              exit 1
            }

            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active - $env:NGROK_TCP_ADDRESS"
            Start-Sleep -Seconds 300
          }
