name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ------------------------------------------------------------
      # 1. Strip Bloat & Tune RDP for Maximum Performance
      # ------------------------------------------------------------
      - name: Configure Core RDP and Performance Settings
        shell: pwsh
        run: |
          Write-Host "Disabling heavy background services to eliminate input lag..."
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # Iterate services individually to prevent parameter array binding errors
          @('SysMain', 'WSearch') | ForEach-Object {
            Stop-Service -Name $_ -Force -ErrorAction SilentlyContinue
            Set-Service -Name $_ -StartupType Disabled -ErrorAction SilentlyContinue
          }

          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force

          # Disable device redirections to reduce packet overhead
          $tsPolicyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPolicyPath)) { New-Item -Path $tsPolicyPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPolicyPath -Name "fDisableCcm" -Value 1 -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "fDisableLPT" -Value 1 -Force
          Set-ItemProperty -Path $tsPolicyPath -Name "MinCompressionSize" -Value 1 -Force

          netsh advfirewall firewall delete rule name="RDP-Inbound" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Inbound" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      # ------------------------------------------------------------
      # 2. Create User Credentials
      # ------------------------------------------------------------
      - name: Create RDP User
        shell: pwsh
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]](35..38) + [char[]](48..57)
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if ($existingUser) { Remove-LocalUser -Name "RDP" }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires -Description "GitHub Actions RDP user"
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "=========================================="
          Write-Host "Username: RDP"
          Write-Host "Password: $password"
          Write-Host "=========================================="

      # ------------------------------------------------------------
      # 3. Fast-Download Pre-built Binary (No Cargo Compilation)
      # ------------------------------------------------------------
      - name: Download Pre-built bore Tunnel
        shell: pwsh
        run: |
          Write-Host "Downloading pre-compiled bore release via GitHub CLI..."
          $binDir = Join-Path $env:USERPROFILE "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          # Download binary archive instantly using the GitHub CLI
          gh release download --repo ekzhang/bore --pattern "*x86_64-pc-windows-msvc.zip" --output "$binDir\bore.zip"
          Expand-Archive -Path "$binDir\bore.zip" -DestinationPath $binDir -Force
          Remove-Item "$binDir\bore.zip" -Force

          $borePath = Join-Path $binDir "bore.exe"
          if (-not (Test-Path $borePath)) {
            Write-Error "Failed to locate bore.exe."
            exit 1
          }

          Write-Host "bore binary ready at: $borePath"
          "BORE_EXE=$borePath" >> $env:GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      # ------------------------------------------------------------
      # 4. Start Tunnel and Maintain Connection
      # ------------------------------------------------------------
      - name: Start Tunnel and Maintain Connection
        shell: pwsh
        run: |
          $borePath = $env:BORE_EXE

          Write-Host "Starting bore TCP tunnel on port 3389..."
          $boreJob = Start-Process `
            -FilePath $borePath `
            -ArgumentList "local", "3389", "--to", "bore.pub" `
            -RedirectStandardOutput "bore.log" `
            -RedirectStandardError "bore-err.log" `
            -PassThru

          $boreAddress = $null

          for ($retry = 1; $retry -le 25; $retry++) {
            Start-Sleep -Seconds 1

            foreach ($log in @("bore.log", "bore-err.log")) {
              if (Test-Path $log) {
                $content = Get-Content $log -Raw -ErrorAction SilentlyContinue
                if ($content -match "listening at ([\w\.\-]+:\d+)|bore\.pub[^\d]*(\d{4,5})") {
                  $boreAddress = if ($matches[1]) { $matches[1] } else { "bore.pub:$($matches[2])" }
                  break
                }
              }
            }

            if ($boreAddress) { break }

            if ($boreJob.HasExited) {
              Write-Host "bore exited prematurely, restarting..."
              $boreJob = Start-Process `
                -FilePath $borePath `
                -ArgumentList "local", "3389", "--to", "bore.pub" `
                -RedirectStandardOutput "bore.log" `
                -RedirectStandardError "bore-err.log" `
                -PassThru
            }
          }

          if (-not $boreAddress) {
            Write-Error "Could not retrieve bore tunnel address."
            Get-Content "bore.log" -ErrorAction SilentlyContinue
            Get-Content "bore-err.log" -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACCESS READY"
          Write-Host "=========================================="
          Write-Host "  Address:  $boreAddress"
          Write-Host "  Username: $env:RDP_USERNAME"
          Write-Host "  Password: $env:RDP_PASSWORD"
          Write-Host "=========================================="
          Write-Host ""

          # Keep runner alive
          while ($true) {
            if ($boreJob.HasExited) {
              Write-Host "bore process stopped. Restarting..."
              $boreJob = Start-Process `
                -FilePath $borePath `
                -ArgumentList "local", "3389", "--to", "bore.pub" `
                -RedirectStandardOutput "bore.log" `
                -RedirectStandardError "bore-err.log" `
                -PassThru
            }
            Start-Sleep -Seconds 30
          }
